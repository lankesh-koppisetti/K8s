apiVersion: v1
kind: ServiceAccount

metadata:
  name: cluster-autoscaler
  namespace: kube-system

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: cluster-autoscaler

rules:
- apiGroups: [""]
  resources: ["pods","services","nodes","events"]
  verbs: ["get","list","watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: cluster-autoscaler

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler

subjects:
- kind: ServiceAccount
  name: cluster-autoscaler
  namespace: kube-system
