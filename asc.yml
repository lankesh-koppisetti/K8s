apiVersion: apps/v1
kind: Deployment

metadata:
  name: cluster-autoscaler
  namespace: kube-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cluster-autoscaler

  template:
    metadata:
      labels:
        app: cluster-autoscaler

    spec:
      containers:
      - image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.35.0

        name: cluster-autoscaler

        command:
        - ./cluster-autoscaler
        - --cloud-provider=aws
        - --nodes=1:3:nodes-us-east-1a

        env:
        - name: AWS_REGION
          value: us-east-1
